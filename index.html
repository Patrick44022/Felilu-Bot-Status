<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serverstatus</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --ok: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
      --border: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(100%, 520px);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .sub { color: var(--muted); margin-bottom: 22px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 14px rgba(245, 158, 11, .7);
    }
    .online .dot { background: var(--ok); box-shadow: 0 0 14px rgba(34, 197, 94, .7); }
    .offline .dot { background: var(--bad); box-shadow: 0 0 14px rgba(239, 68, 68, .7); }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 12px 0 18px;
    }
    .row {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(15, 23, 42, .65);
    }
    .label { color: var(--muted); font-size: .92rem; margin-bottom: 4px; }
    .value { font-size: 1rem; word-break: break-word; }
    .footer { color: var(--muted); font-size: .92rem; }
    .error { color: #fecaca; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Serverstatus</h1>
    <div class="sub">Diese Seite liest <code>status.json</code> direkt aus deinem GitHub-Pages-Repo.</div>

    <div id="statusBadge" class="status">
      <span class="dot"></span>
      <span id="statusText">Lade Status ...</span>
    </div>

    <section class="grid">
      <div class="row">
        <div class="label">Nachricht</div>
        <div id="message" class="value">—</div>
      </div>
      <div class="row">
        <div class="label">Letztes Signal</div>
        <div id="updatedAt" class="value">—</div>
      </div>
      <div class="row">
        <div class="label">Servername</div>
        <div id="serverName" class="value">—</div>
      </div>
      <div class="row">
        <div class="label">Hinweis</div>
        <div id="detail" class="value">Wenn das letzte Update zu alt ist, zeigt die Seite automatisch OFFLINE an.</div>
      </div>
    </section>

    <div class="footer" id="footer">Aktualisiert alle 30 Sekunden.</div>
  </main>

  <script>
    const STATUS_URL = "./status.json";
    const OFFLINE_AFTER_MS = 3 * 60 * 1000; // 3 Minuten

    function setBadge(state, text) {
      const badge = document.getElementById("statusBadge");
      badge.className = "status " + state;
      document.getElementById("statusText").textContent = text;
    }

    async function loadStatus() {
      try {
        const res = await fetch(STATUS_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("status.json konnte nicht geladen werden");
        const data = await res.json();

        const updatedAt = data.updatedAt ? new Date(data.updatedAt) : null;
        const tooOld = !updatedAt || (Date.now() - updatedAt.getTime() > OFFLINE_AFTER_MS);
        const online = Boolean(data.online) && !tooOld;

        setBadge(online ? "online" : "offline", online ? "ONLINE" : "OFFLINE");
        document.getElementById("message").textContent = data.message || "Keine Nachricht";
        document.getElementById("serverName").textContent = data.serverName || "Unbekannt";
        document.getElementById("updatedAt").textContent = updatedAt
          ? updatedAt.toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "medium" })
          : "Noch nie";
        document.getElementById("detail").textContent = tooOld
          ? "Kein frisches Update mehr erkannt. Der Server gilt deshalb als OFFLINE."
          : "Es kam vor kurzem ein frisches Update vom Server.";
        document.getElementById("footer").textContent =
          "Letzte Prüfung: " + new Date().toLocaleString("de-DE");
      } catch (err) {
        setBadge("offline", "OFFLINE");
        document.getElementById("message").textContent = "Fehler beim Laden";
        document.getElementById("updatedAt").textContent = "—";
        document.getElementById("serverName").textContent = "—";
        document.getElementById("detail").innerHTML =
          '<span class="error">' + err.message + "</span>";
      }
    }

    loadStatus();
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
