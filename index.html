<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felilu Bot Status</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0f172a;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.serverStatus{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-bottom:40px;
}

.serverOnline{
    color:#22c55e;
    text-shadow:0 0 20px #22c55e;
}

.serverOffline{
    color:#ef4444;
    text-shadow:0 0 20px #ef4444;
}

.botGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.botCard{
    background:#111827;
    border-radius:20px;
    padding:20px;
    position:relative;
    transition:0.3s;
}

.botCard:hover{
    transform:translateY(-5px);
}

.botTop{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    position:relative;
}

.avatar img{
    width:60px;
    height:60px;
    border-radius:50%;
}

.statusDot{
    width:14px;
    height:14px;
    border-radius:50%;
    position:absolute;
    bottom:0;
    right:0;
    border:3px solid #111827;
}

.online{
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}

.offline{
    background:#ef4444;
    box-shadow:0 0 12px #ef4444;
}

.maintenance{
    background:#f59e0b;
    box-shadow:0 0 12px #f59e0b;
}

.botName{
    font-weight:bold;
    font-size:18px;
}

.botTag{
    color:#9ca3af;
    font-size:14px;
}

.botBadge{
    margin-top:12px;
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:bold;
}

.badgeOnline{
    background:#14532d;
    color:#4ade80;
}

.badgeOffline{
    background:#7f1d1d;
    color:#f87171;
}

.badgeMaintenance{
    background:#78350f;
    color:#fbbf24;
}

</style>
</head>

<body>

<div class="container">

<div id="serverStatus" class="serverStatus">Server wird geladen...</div>

<div id="botGrid" class="botGrid"></div>

</div>

<script>

const STATUS_URL="./status.json";
const OFFLINE_AFTER=3*60*1000;

const bots=[
{name:"Felilu Guard",tag:"#1001",status:"online",avatar:"https://cdn.discordapp.com/embed/avatars/0.png"},
{name:"Felilu Music",tag:"#1002",status:"online",avatar:"https://cdn.discordapp.com/embed/avatars/1.png"},
{name:"Felilu Tickets",tag:"#1003",status:"maintenance",avatar:"https://cdn.discordapp.com/embed/avatars/2.png"},
{name:"Felilu Logs",tag:"#1004",status:"online",avatar:"https://cdn.discordapp.com/embed/avatars/3.png"},
{name:"Felilu Verify",tag:"#1005",status:"online",avatar:"https://cdn.discordapp.com/embed/avatars/4.png"},
{name:"Felilu AI",tag:"#1006",status:"offline",avatar:"https://cdn.discordapp.com/embed/avatars/5.png"},
{name:"Felilu Stats",tag:"#1007",status:"online",avatar:"https://cdn.discordapp.com/embed/avatars/0.png"},
{name:"Felilu Welcome",tag:"#1008",status:"maintenance",avatar:"https://cdn.discordapp.com/embed/avatars/1.png"},
{name:"Felilu Backup",tag:"#1009",status:"online",avatar:"https://cdn.discordapp.com/embed/avatars/2.png"},
{name:"Felilu Notify",tag:"#1010",status:"online",avatar:"https://cdn.discordapp.com/embed/avatars/3.png"}
];

function renderBots(serverOnline){

const grid=document.getElementById("botGrid");
grid.innerHTML="";

bots.forEach(bot=>{

let status=serverOnline?bot.status:"offline";

let badge="badgeOnline";
let dot="online";
let label="ONLINE";

if(status==="offline"){
badge="badgeOffline";
dot="offline";
label="OFFLINE";
}

if(status==="maintenance"){
badge="badgeMaintenance";
dot="maintenance";
label="WARTUNG";
}

grid.innerHTML+=`
<div class="botCard">

<div class="botTop">

<div class="avatar">
<img src="${bot.avatar}">
<div class="statusDot ${dot}"></div>
</div>

<div>
<div class="botName">${bot.name}</div>
<div class="botTag">${bot.tag}</div>
</div>

</div>

<div class="botBadge ${badge}">${label}</div>

</div>
`;

});

}

async function loadStatus(){

try{

const res=await fetch(STATUS_URL+"?"+Date.now());
const data=await res.json();

let updated=data.updatedAt?new Date(data.updatedAt):null;
let tooOld=!updated||(Date.now()-updated.getTime()>OFFLINE_AFTER);

let serverOnline=data.online&&!tooOld;

let serverText=document.getElementById("serverStatus");

if(serverOnline){
serverText.className="serverStatus serverOnline";
serverText.textContent="SERVER ONLINE";
}else{
serverText.className="serverStatus serverOffline";
serverText.textContent="SERVER OFFLINE";
}

renderBots(serverOnline);

}catch{

document.getElementById("serverStatus").textContent="SERVER OFFLINE";
renderBots(false);

}

}

loadStatus();
setInterval(loadStatus,30000);

</script>

</body>
</html>
